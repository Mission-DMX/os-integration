name: Build & publish Mission-DMX OS

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    name: Build image & publish factory + update repo
    runs-on: self-hosted
    # Default job timeout is 360 min (6 h), which a cold full Yocto build
    # of core-image-minimal + the RAUC bundle + sign + publish can exceed
    # on the shared runner — especially under the BB_NUMBER_THREADS=4
    # cap. 48 h gives generous headroom for the once-per-main-push build;
    # a legitimate hang will still be caught by this ceiling, just not by
    # the stock 6 h cutoff.
    timeout-minutes: 4320
    env:
      # Fail fast on git credential prompts instead of hanging on /dev/tty.
      # Several recipes (polkit, …) fetch from github.com; on a transient
      # GitHub blip git would otherwise prompt for a username ("could not
      # read Username for 'https://github.com': No such device or address"
      # in do_fetch), which drowns the real HTTP error. Disabling the
      # prompt lets bitbake surface the actual error and fall through to
      # its MIRRORS list cleanly.
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout Repository incl. Submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Wipe previous build state
        # The self-hosted actions-runner workspace persists between
        # jobs: build/ is gitignored, so `actions/checkout`'s default
        # `git clean` leaves it in place. That means stale state from a
        # previous run — half-populated DL_DIR, bitbake stamps that no
        # longer match reality, cached task metadata referencing files
        # that have since been pruned — can leak into the current run
        # and manifest as surprising late-stage failures (e.g. do_fetch
        # being skipped on a stamp hit while the tarball is actually
        # missing, so do_unpack crashes with "No such file or
        # directory"). A full `make clean` (which is `rm -rf build`)
        # before any other setup guarantees a cold start every time.
        # Matches the no-stale-artefacts posture already applied to
        # DL_DIR; the 48 h job timeout covers the resulting full cold
        # rebuild.
        run: make clean

      - name: Fail fast if any signing secret is missing
        env:
          RSA_KEY:    ${{ secrets.MDMX_RSA_SIGNING_KEY   }}
          RSA_CERT:   ${{ secrets.MDMX_RSA_SIGNING_CERT  }}
          MLDSA_KEY:  ${{ secrets.MDMX_MLDSA_SIGNING_KEY }}
          MLDSA_CERT: ${{ secrets.MDMX_MLDSA_SIGNING_CERT }}
        run: |
          missing=0
          for v in RSA_KEY RSA_CERT MLDSA_KEY MLDSA_CERT; do
            if [ -z "${!v}" ]; then
              echo "::error ::missing required signing secret: MDMX_${v/_/_SIGNING_}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Install production signing keys
        env:
          RSA_KEY:    ${{ secrets.MDMX_RSA_SIGNING_KEY   }}
          RSA_CERT:   ${{ secrets.MDMX_RSA_SIGNING_CERT  }}
          MLDSA_KEY:  ${{ secrets.MDMX_MLDSA_SIGNING_KEY }}
          MLDSA_CERT: ${{ secrets.MDMX_MLDSA_SIGNING_CERT }}
        run: |
          umask 077
          mkdir -p keys/signing
          printf '%s' "$RSA_KEY"    > keys/signing/rsa.key
          printf '%s' "$RSA_CERT"   > keys/signing/rsa.cert.pem
          printf '%s' "$MLDSA_KEY"  > keys/signing/mldsa65.key
          printf '%s' "$MLDSA_CERT" > keys/signing/mldsa65.cert.pem
          chmod 600 keys/signing/rsa.key keys/signing/mldsa65.key

      - name: Initialize build dir and inject CI overrides into local.conf
        # Done BEFORE fetch so the shared DL_DIR is in place when the
        # fetcher runs; otherwise the fetch step would populate the
        # workspace-local build/downloads/ and the shared cache would
        # stay empty.
        #
        # `make build/init` runs the Makefile's $(BUILD_DIR)/init
        # recipe — oe-init-build-env (creates build/conf/) + apparmor
        # hint + stripping the stock local.conf/bblayers.conf. The
        # following two targets then cp our checked-in configs into
        # place. After that we append the CI-only overrides on top:
        #
        #   DL_DIR          — shared across CI runs; purged weekly by
        #                     .github/workflows/maintenance.yml.
        #                     Intentionally NOT touched by `make clean`
        #                     (which runs between every CI build and
        #                     also from local dev workstations), so the
        #                     cache survives individual run boundaries
        #                     and only resets on the maintenance cadence.
        #
        #   BB_NUMBER_THREADS / PARALLEL_MAKE — cap parallelism to keep
        #                     the kernel link within budget on the
        #                     shared runner. Env-level overrides don't
        #                     work for PARALLEL_MAKE (not in bitbake's
        #                     default env passthrough), so local.conf
        #                     is the authoritative knob.
        run: |
          make build/init build/conf/local.conf build/conf/bblayers.conf
          cat >> build/conf/local.conf <<'EOF'

          # --- CI-only overrides, injected by .github/workflows/main.yml ---
          DL_DIR = "/var/tmp/mdmx-yocto-dl"
          BB_NUMBER_THREADS = "4"
          PARALLEL_MAKE = "-j 4"
          EOF

      - name: Fetch all sources
        # Isolate the network-sensitive phase from the hours-long compile.
        # Self-hosted runners sharing a NAT'd IP occasionally see GitHub
        # cut a smart-HTTP response mid-ref-listing ("expected flush after
        # ref listing" in do_fetch); the Yocto source mirrors don't carry
        # everything (polkit, …) so a single flake used to stop the whole
        # build. Three attempts with a short backoff turns a flake into
        # a non-event; a real breakage still fails the job.
        run: |
          for attempt in 1 2 3; do
            if make fetch; then
              exit 0
            fi
            echo "::warning ::make fetch failed on attempt $attempt/3; retrying after short pause"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

      - name: Build Yocto image
        # Three attempts, with the same rationale as the fetch retry
        # above: transient faults (sstate server blips, a fallocate on a
        # busy host returning EAGAIN, a one-off PyPI resolution landing
        # on a broken pin before the pins we care about take effect, …)
        # happen regularly on a shared self-hosted runner. bitbake task
        # stamps + the persistent sstate cache mean a retry picks up
        # where the previous attempt died — only the single failed task
        # (and anything downstream of it) re-runs. A real breakage will
        # fail all three attempts at the same task and still surface as
        # a job failure; a flake clears on attempt two or three.
        run: |
          for attempt in 1 2 3; do
            if make build; then
              exit 0
            fi
            echo "::warning ::make build failed on attempt $attempt/3; retrying after short pause"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

      - name: Build & sign RAUC bundle, stage update repo
        run: make publish

      - name: Stage factory image under a clean name
        run: |
          mkdir -p build/factory-stage
          cp build/tmp/deploy/images/qemux86-64/core-image-minimal-qemux86-64.rootfs.wic.xz   build/factory-stage/mdmx-os-factory.wic.xz
          cp build/tmp/deploy/images/qemux86-64/core-image-minimal-qemux86-64.rootfs.wic.bmap build/factory-stage/mdmx-os-factory.wic.bmap

      - name: Publish update repository
        run: sudo /home/deploy/deploy.bash build/updates/ downloads/os-updates/

      - name: Publish factory image
        run: |
          sudo /home/deploy/deploy.bash build/factory-stage/mdmx-os-factory.wic.xz   downloads/
          sudo /home/deploy/deploy.bash build/factory-stage/mdmx-os-factory.wic.bmap downloads/

      - name: Scrub signing keys from runner workspace
        if: always()
        run: |
          rm -f keys/signing/rsa.key \
                keys/signing/rsa.cert.pem \
                keys/signing/mldsa65.key \
                keys/signing/mldsa65.cert.pem \
                keys/signing/trust-bundle.pem
