name: Build & publish Mission-DMX OS

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    name: Build image & publish factory + update repo
    runs-on: self-hosted
    env:
      # Fail fast on git credential prompts instead of hanging on /dev/tty.
      # Several recipes (polkit, …) fetch from github.com; on a transient
      # GitHub blip git would otherwise prompt for a username ("could not
      # read Username for 'https://github.com': No such device or address"
      # in do_fetch), which drowns the real HTTP error. Disabling the
      # prompt lets bitbake surface the actual error and fall through to
      # its MIRRORS list cleanly.
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout Repository incl. Submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fail fast if any signing secret is missing
        env:
          RSA_KEY:    ${{ secrets.MDMX_RSA_SIGNING_KEY   }}
          RSA_CERT:   ${{ secrets.MDMX_RSA_SIGNING_CERT  }}
          MLDSA_KEY:  ${{ secrets.MDMX_MLDSA_SIGNING_KEY }}
          MLDSA_CERT: ${{ secrets.MDMX_MLDSA_SIGNING_CERT }}
        run: |
          missing=0
          for v in RSA_KEY RSA_CERT MLDSA_KEY MLDSA_CERT; do
            if [ -z "${!v}" ]; then
              echo "::error ::missing required signing secret: MDMX_${v/_/_SIGNING_}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Install production signing keys
        env:
          RSA_KEY:    ${{ secrets.MDMX_RSA_SIGNING_KEY   }}
          RSA_CERT:   ${{ secrets.MDMX_RSA_SIGNING_CERT  }}
          MLDSA_KEY:  ${{ secrets.MDMX_MLDSA_SIGNING_KEY }}
          MLDSA_CERT: ${{ secrets.MDMX_MLDSA_SIGNING_CERT }}
        run: |
          umask 077
          mkdir -p keys/signing
          printf '%s' "$RSA_KEY"    > keys/signing/rsa.key
          printf '%s' "$RSA_CERT"   > keys/signing/rsa.cert.pem
          printf '%s' "$MLDSA_KEY"  > keys/signing/mldsa65.key
          printf '%s' "$MLDSA_CERT" > keys/signing/mldsa65.cert.pem
          chmod 600 keys/signing/rsa.key keys/signing/mldsa65.key

      - name: Fetch all sources
        # Isolate the network-sensitive phase from the hours-long compile.
        # Self-hosted runners sharing a NAT'd IP occasionally see GitHub
        # cut a smart-HTTP response mid-ref-listing ("expected flush after
        # ref listing" in do_fetch); the Yocto source mirrors don't carry
        # everything (polkit, …) so a single flake used to stop the whole
        # build. Three attempts with a short backoff turns a flake into
        # a non-event; a real breakage still fails the job.
        run: |
          for attempt in 1 2 3; do
            if make fetch; then
              exit 0
            fi
            echo "::warning ::make fetch failed on attempt $attempt/3; retrying after short pause"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

      - name: Build Yocto image
        run: make build

      - name: Build & sign RAUC bundle, stage update repo
        run: make publish

      - name: Stage factory image under a clean name
        run: |
          mkdir -p build/factory-stage
          cp build/tmp/deploy/images/qemux86-64/core-image-minimal-qemux86-64.rootfs.wic.xz   build/factory-stage/mdmx-os-factory.wic.xz
          cp build/tmp/deploy/images/qemux86-64/core-image-minimal-qemux86-64.rootfs.wic.bmap build/factory-stage/mdmx-os-factory.wic.bmap

      - name: Publish update repository
        run: sudo /home/deploy/deploy.bash build/updates/ downloads/os-updates/

      - name: Publish factory image
        run: |
          sudo /home/deploy/deploy.bash build/factory-stage/mdmx-os-factory.wic.xz   downloads/
          sudo /home/deploy/deploy.bash build/factory-stage/mdmx-os-factory.wic.bmap downloads/

      - name: Scrub signing keys from runner workspace
        if: always()
        run: |
          rm -f keys/signing/rsa.key \
                keys/signing/rsa.cert.pem \
                keys/signing/mldsa65.key \
                keys/signing/mldsa65.cert.pem \
                keys/signing/trust-bundle.pem
