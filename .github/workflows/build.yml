name: Build Mission-DMX OS (branch)

on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    name: Build image (no publish)
    runs-on: self-hosted
    # Default job timeout is 360 min (6 h); a cold full Yocto build can
    # exceed that on the shared runner under the BB_NUMBER_THREADS=4
    # cap. 48 h ceiling catches real hangs without killing legitimate
    # long builds. See main.yml for the longer rationale.
    timeout-minutes: 4320
    env:
      # Fail fast on git credential prompts instead of hanging on /dev/tty
      # when a transient GitHub blip causes git to re-auth mid-clone. See
      # main.yml for the longer rationale.
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout Repository incl. Submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Wipe previous build state
        # See main.yml for the longer rationale: build/ is gitignored
        # and the actions-runner workspace persists between jobs, so
        # stale sstate / stamps / caches can leak into this run and
        # confuse bitbake into skipping tasks whose outputs have since
        # gone missing. `make clean` (= `rm -rf build`) resets to a
        # known-empty state.
        run: make clean

      - name: Regenerate disposable dev signing keys
        run: |
          rm -rf keys/signing
          ./sign-images.sh --regen-keys --stage-keyring

      - name: Initialize build dir and inject CI overrides into local.conf
        # Done BEFORE fetch so the shared DL_DIR is in place when the
        # fetcher runs. See main.yml for the longer rationale (DL_DIR
        # cache + parallelism caps, injected on top of the checked-in
        # local.conf after `make build/init` has materialized build/conf/).
        run: |
          make build/init build/conf/local.conf build/conf/bblayers.conf
          cat >> build/conf/local.conf <<'EOF'

          # --- CI-only overrides, injected by .github/workflows/build.yml ---
          DL_DIR = "/var/tmp/mdmx-yocto-dl"
          BB_NUMBER_THREADS = "4"
          PARALLEL_MAKE = "-j 4"
          EOF

      - name: Fetch all sources
        # Three attempts to absorb transient GitHub fetch flakes on the
        # shared runner; see main.yml for the full rationale.
        run: |
          for attempt in 1 2 3; do
            if make fetch; then
              exit 0
            fi
            echo "::warning ::make fetch failed on attempt $attempt/3; retrying after short pause"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

      - name: Build Yocto image
        # Three attempts to absorb transient faults on the shared
        # runner; bitbake stamps + persistent sstate mean a retry only
        # re-runs the task that died. See main.yml for the longer
        # rationale.
        run: |
          for attempt in 1 2 3; do
            if make build; then
              exit 0
            fi
            echo "::warning ::make build failed on attempt $attempt/3; retrying after short pause"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

      - name: Build & sign RAUC bundle (local artifacts only)
        run: make publish
