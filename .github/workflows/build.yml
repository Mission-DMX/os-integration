name: Build Mission-DMX OS (branch)

on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    name: Build image (no publish)
    runs-on: self-hosted
    # Default job timeout is 360 min (6 h); a cold full Yocto build can
    # exceed that on the shared runner under the BB_NUMBER_THREADS=4
    # cap. 48 h ceiling catches real hangs without killing legitimate
    # long builds. See main.yml for the longer rationale.
    timeout-minutes: 2880
    env:
      # Fail fast on git credential prompts instead of hanging on /dev/tty
      # when a transient GitHub blip causes git to re-auth mid-clone. See
      # main.yml for the longer rationale.
      GIT_TERMINAL_PROMPT: "0"
      # Cap parallelism on the shared self-hosted runner so the kernel
      # vmlinux link + sorttable step doesn't exhaust RAM (sorttable
      # segfaults on MAP_FAILED). See main.yml for the longer rationale.
      BB_NUMBER_THREADS: "4"
      PARALLEL_MAKE: "-j 4"
    steps:
      - name: Checkout Repository incl. Submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Regenerate disposable dev signing keys
        run: |
          rm -rf keys/signing
          ./sign-images.sh --regen-keys --stage-keyring

      - name: Fetch all sources
        # Three attempts to absorb transient GitHub fetch flakes on the
        # shared runner; see main.yml for the full rationale.
        run: |
          for attempt in 1 2 3; do
            if make fetch; then
              exit 0
            fi
            echo "::warning ::make fetch failed on attempt $attempt/3; retrying after short pause"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

      - name: Build Yocto image
        run: make build

      - name: Build & sign RAUC bundle (local artifacts only)
        run: make publish
