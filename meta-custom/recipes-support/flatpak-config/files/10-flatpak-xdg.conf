# Drop-in applied by flatpak-config: extends sway.service's session
# environment for Flatpak-exported apps and D-Bus-activated portal
# backends.
#
# XDG_DATA_DIRS: makes fuzzel (and any sway child) see .desktop files
# exported by Flatpak into /var/lib/flatpak/exports/share (system
# installs) and ~user/.local/share/flatpak/exports/share (per-user
# installs). Keeps /usr/local/share:/usr/share as the system default
# suffix. Pinned here rather than sourced from /etc/profile.d/flatpak.sh
# so we don't inherit side effects from unrelated profile.d scripts.
#
# WAYLAND_DISPLAY is intentionally NOT set here. wlroots selects its
# backend from the environment at compositor startup — if WAYLAND_DISPLAY
# is present it picks the nested Wayland backend and tries to connect to
# the socket that sway hasn't created yet, which fails with "Could not
# connect to remote display" and makes sway exit immediately. The
# dbus-activated portals get WAYLAND_DISPLAY from the sway config's
# `exec_always dbus-update-activation-environment --sh WAYLAND_DISPLAY …`
# in 70-portals.conf, which runs AFTER sway has created the socket.
# Flatpak host apps inherit it from the shell env via
# /etc/profile.d/sway-env.sh.
#
# XDG_CURRENT_DESKTOP: xdg-desktop-portal uses this to select a
# per-interface backend. The sway-portals.conf shipped alongside this
# recipe is keyed on "sway" and routes screenshot/screencast to the
# wlr backend.
[Service]
Environment=XDG_DATA_DIRS=/var/lib/flatpak/exports/share:/home/user/.local/share/flatpak/exports/share:/usr/local/share:/usr/share
Environment=XDG_CURRENT_DESKTOP=sway
