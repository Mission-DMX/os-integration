# Push Wayland + session identity into the D-Bus activation environment
# so xdg-desktop-portal and xdg-desktop-portal-wlr (activated on demand
# via /usr/share/dbus-1/services/) can connect back to sway. systemd
# --user is unavailable on this image so we don't update its env.
exec_always dbus-update-activation-environment --sh WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR

# Start the PipeWire daemon as a child of sway (runs as user=user).
# xdg-desktop-portal-wlr talks to pipewire for screencast; PulseAudio
# remains the audio backend. pipewire creates its socket at
# $XDG_RUNTIME_DIR/pipewire-0 → /run/sway/pipewire-0.
exec /usr/bin/pipewire
