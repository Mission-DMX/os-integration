# GRUB 2 configuration for MissionDMX A/B slot boot.
# Layout follows RAUC's grub bootloader integration so `rauc install`
# and `rauc-mark-good` can drive the ORDER / <slot>_OK / <slot>_TRY
# variables without any further config changes when RAUC is added later.

default=0
timeout=3

if [ -s $prefix/grubenv ]; then
    load_env
fi

CMDLINE="console=ttyS0,115200 console=tty0 ro quiet"

if [ "$ORDER" = "" ]; then
    ORDER="A B"
fi
if [ "$A_OK" = "" ]; then A_OK=1; fi
if [ "$B_OK" = "" ]; then B_OK=1; fi
if [ "$A_TRY" = "" ]; then A_TRY=0; fi
if [ "$B_TRY" = "" ]; then B_TRY=0; fi

for SLOT in $ORDER; do
    if [ "$SLOT" = "A" ]; then
        INDEX=0
        OK=$A_OK
        TRY=$A_TRY
        A_TRY=1
    fi
    if [ "$SLOT" = "B" ]; then
        INDEX=1
        OK=$B_OK
        TRY=$B_TRY
        B_TRY=1
    fi
    if [ "$OK" = "1" -a "$TRY" = "0" ]; then
        default=$INDEX
        break
    fi
done

save_env A_TRY B_TRY ORDER

menuentry "MissionDMX (slot A)" {
    search --set=root --label rootfsA
    linux /boot/bzImage root=PARTLABEL=rootfsA rauc.slot=A $CMDLINE
    initrd /boot/initrd
}

menuentry "MissionDMX (slot B)" {
    search --set=root --label rootfsB
    linux /boot/bzImage root=PARTLABEL=rootfsB rauc.slot=B $CMDLINE
    initrd /boot/initrd
}
