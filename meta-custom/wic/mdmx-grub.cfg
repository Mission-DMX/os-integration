# GRUB 2 configuration for MissionDMX A/B slot boot.
# Layout follows RAUC's grub bootloader integration so `rauc install`
# and `rauc-mark-good` can drive the ORDER / <slot>_OK / <slot>_TRY
# variables without any further config changes when RAUC is added later.

default=0
timeout=3

if [ -s $prefix/grubenv ]; then
    load_env
fi

CMDLINE="console=ttyS0,115200 console=tty0 ro quiet"

if [ "$ORDER" = "" ]; then
    ORDER="A B"
fi
if [ "$A_OK" = "" ]; then A_OK=1; fi
if [ "$B_OK" = "" ]; then B_OK=1; fi
if [ "$A_TRY" = "" ]; then A_TRY=0; fi
if [ "$B_TRY" = "" ]; then B_TRY=0; fi

for SLOT in $ORDER; do
    if [ "$SLOT" = "A" ]; then
        INDEX=0
        OK=$A_OK
        TRY=$A_TRY
        A_TRY=1
    fi
    if [ "$SLOT" = "B" ]; then
        INDEX=1
        OK=$B_OK
        TRY=$B_TRY
        B_TRY=1
    fi
    if [ "$OK" = "1" -a "$TRY" = "0" ]; then
        default=$INDEX
        break
    fi
done

save_env A_TRY B_TRY ORDER

# GRUB 2's `search` only knows filesystem identifiers (--label, --fs-uuid,
# --file) — it has no `--part-label`. Both rootfs slots carry the same
# ext4 blob (rootfsB is populated via wic's `rawcopy` of the same .ext4
# file as rootfsA, and RAUC rewrites B with the update bundle's .ext4
# which also keeps the factory label), so --label can't distinguish
# them either, and --fs-uuid matches both. The wic layout is fixed
# (gpt1=esp, gpt2=rootfsA, gpt3=rootfsB — see meta-custom/wic/mdmx-ab.wks.in),
# so pin $root to the known partition index.
#
# We hardcode the boot disk to hd0: qemux86-64 has a single virtio disk
# and the target embedded hardware boots from a single eMMC. If this ever
# runs on a multi-disk machine, add `regexp` to GRUB_BUILDIN in local.conf
# and derive the disk from $prefix:
#     insmod regexp
#     regexp -s 1:BOOTDISK '^\(([^,)]+)' "$prefix"
# (default GRUB_BUILDIN in poky's grub-efi_2.12.bb doesn't ship regexp.)
BOOTDISK=hd0

menuentry "MissionDMX (slot A)" {
    set root=(${BOOTDISK},gpt2)
    linux /boot/bzImage root=PARTLABEL=rootfsA rauc.slot=A $CMDLINE
    initrd /boot/initrd
}

menuentry "MissionDMX (slot B)" {
    set root=(${BOOTDISK},gpt3)
    linux /boot/bzImage root=PARTLABEL=rootfsB rauc.slot=B $CMDLINE
    initrd /boot/initrd
}
