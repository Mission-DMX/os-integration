# GRUB 2 configuration for MissionDMX (debug variant).
# Same slot-selection logic as mdmx-grub.cfg but adds `nokaslr` to
# CMDLINE so the kernel remains addressable by the qemu gdb stub.

default=0
timeout=3

if [ -s $prefix/grubenv ]; then
    load_env
fi

CMDLINE="console=ttyS0,115200 console=tty0 rw quiet nokaslr"

if [ "$ORDER" = "" ]; then
    ORDER="A B"
fi
if [ "$A_OK" = "" ]; then A_OK=1; fi
if [ "$B_OK" = "" ]; then B_OK=1; fi
if [ "$A_TRY" = "" ]; then A_TRY=0; fi
if [ "$B_TRY" = "" ]; then B_TRY=0; fi

for SLOT in $ORDER; do
    if [ "$SLOT" = "A" ]; then
        INDEX=0
        OK=$A_OK
        TRY=$A_TRY
        A_TRY=1
    fi
    if [ "$SLOT" = "B" ]; then
        INDEX=1
        OK=$B_OK
        TRY=$B_TRY
        B_TRY=1
    fi
    if [ "$OK" = "1" -a "$TRY" = "0" ]; then
        default=$INDEX
        break
    fi
done

save_env A_TRY B_TRY ORDER

menuentry "MissionDMX (slot A, debug)" {
    search --set=root --label rootfsA
    linux /boot/bzImage root=PARTLABEL=rootfsA rauc.slot=A $CMDLINE
    initrd /boot/initrd
}

menuentry "MissionDMX (slot B, debug)" {
    search --set=root --label rootfsB
    linux /boot/bzImage root=PARTLABEL=rootfsB rauc.slot=B $CMDLINE
    initrd /boot/initrd
}
