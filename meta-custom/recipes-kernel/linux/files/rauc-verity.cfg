# Kernel options required for RAUC verity-format bundles.
#
# RAUC packages the bundle contents as a squashfs mounted through
# dm-verity: `rauc install` creates a verity mapping over the raucb
# file, then loop-mounts the squashfs on top of it. Without SQUASHFS the
# mount fails with "squashfs support not enabled in kernel"; without
# DM_VERITY the mapping can't be built even if the squashfs mounts.
#
# MISC_FILESYSTEMS is the gating `menuconfig` over SQUASHFS in
# fs/Kconfig. Our base defconfig + linux-yocto's base.cfg between them
# disable every other MISC_FILESYSTEMS child, which leaves
# MISC_FILESYSTEMS itself collapsing to n during `make olddefconfig` —
# and a disabled parent menu silently drops any CONFIG_SQUASHFS=y
# request. Setting it explicitly here keeps the subsystem assignable.
#
# ZLIB is the actual default: `rauc bundle` invokes mksquashfs with no
# `-comp` argument (rauc/src/bundle.c), so the inner squashfs is gzip
# unless a recipe adds `BUNDLE_ARGS += '--mksquashfs-args="-comp ..."'`.
# Kconfig marks SQUASHFS_ZLIB `default y`, but linux-yocto's config
# pipeline collapses that default to n (same way it did for
# MISC_FILESYSTEMS above), which surfaces as mount() returning EINVAL
# at install time — not as a module-missing error. Set it explicitly.
#
# XZ and ZSTD cover the two compressions meta-rauc recipes commonly opt
# into. Cheap to enable all three so any bundle built from this tree
# (or a sibling layer that sets --mksquashfs-args) mounts here.
CONFIG_MISC_FILESYSTEMS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZSTD=y
CONFIG_DM_VERITY=y
