<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Bus policy for the mdmx-network-ctrl daemon. The daemon runs as
       root so it can rewrite /run/systemd/network and restart
       systemd-networkd. The unprivileged desktop user (`user`, created
       by mdmx-user) is the intended caller — that's the account the
       editor runs under and is the only client that sends
       configuration payloads. -->

  <policy user="root">
    <allow own="org.mission_dmx.networking_ctrl"/>
    <allow send_destination="org.mission_dmx.networking_ctrl"/>
  </policy>

  <policy user="user">
    <allow send_destination="org.mission_dmx.networking_ctrl"
           send_interface="org.mission_dmx.networking_ctrl"/>
    <allow send_destination="org.mission_dmx.networking_ctrl"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.mission_dmx.networking_ctrl"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>

  <policy context="default">
    <deny own="org.mission_dmx.networking_ctrl"/>
    <deny send_destination="org.mission_dmx.networking_ctrl"/>
  </policy>
</busconfig>
