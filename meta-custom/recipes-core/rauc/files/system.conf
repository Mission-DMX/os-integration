# RAUC system configuration for MissionDMX A/B firmware.
#
# Matches the fixed WIC layout in meta-custom/wic/mdmx-ab.wks.in:
#   * two 16 GiB ext4 rootfs partitions labelled rootfsA / rootfsB
#   * GRUB-EFI bootloader with grubenv variables ORDER, A_OK/B_OK,
#     A_TRY/B_TRY (already wired up in meta-custom/wic/mdmx-grub.cfg
#     and mdmx-bootcheck.service)
#   * kernel cmdline carries rauc.slot=A|B — meta-rauc's grub-editenv
#     integration keys off the [slot.rootfs.N] `bootname=` below to
#     find the matching grubenv variable.
#
# `bundle-formats=-plain` refuses to install legacy plain-format bundles
# — MissionDMX only ships verity-format bundles (see mdmx-rauc-bundle),
# so a plain-format bundle in the update stream is by definition wrong
# and should be rejected before it touches a slot.

[system]
compatible=MissionDMX
bootloader=grub
grubenv=/boot/efi/EFI/BOOT/grubenv
bundle-formats=-plain
data-directory=/var/lib/rauc

[keyring]
path=/etc/rauc/mdmx-keyring.pem
# Our signing cert carries extendedKeyUsage=codeSigning (see
# sign-images.sh). Without `check-purpose`, CMS_verify() falls back to
# OpenSSL's default SMIME-sign purpose, which demands emailProtection in
# the EKU and rejects a pure code-signing cert with "unsuitable
# certificate purpose". `codesign-rauc` is the custom purpose RAUC
# registers at startup (rauc/src/signature.c: check_purpose_code_sign)
# — it enforces exactly the EKU/KU combination the cert actually has.
check-purpose=codesign-rauc

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfsA
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfsB
type=ext4
bootname=B
