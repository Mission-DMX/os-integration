# PulseAudio refuses to run as root, and sway.service runs as root.
# --system mode side-steps that: pulseaudio forks, drops privileges to
# the `pulse` system user (poky's pulseaudio-server recipe creates it),
# and puts its socket at /var/run/pulse/native. Any client on the box
# — including pactl launched from a plain shell outside sway's session
# — finds the socket there, regardless of its own XDG_RUNTIME_DIR.
# --exit-idle-time=-1 keeps the daemon alive between client requests.
exec /usr/bin/pulseaudio --system --exit-idle-time=-1
