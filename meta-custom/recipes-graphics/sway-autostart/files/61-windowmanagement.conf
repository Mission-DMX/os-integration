# Window-management rules for the kiosk sway session.
#
# This drop-in is included from /etc/sway/config via its final
# `include /etc/sway/config.d/*` line, so the upstream variables are
# already in scope. Sway resolves conflicting `for_window` rules by
# applying all matching rules in order, so anything here layers on top
# of the base config and the layout defaults set in 60-keybindings.conf.

# Float the mdmx editor's Qt splash screen. The Nuitka-compiled binary
# is /opt/MissionDMX/MissionDMX-Editor.dist/editor, so Qt reports
# app_id="editor" (QGuiApplication::applicationFilePath basename, since
# the editor doesn't call setDesktopFileName). The main window calls
# setWindowTitle("Project-Editor"); the splash never sets a title, so
# Qt falls back to the applicationDisplayName "Mission DMX" (from
# pyproject.toml). Without this rule the splash would be swallowed by
# the tabbed workspace_layout and hide behind the main window.
for_window [app_id="editor" title="^Mission DMX$"] floating enable
