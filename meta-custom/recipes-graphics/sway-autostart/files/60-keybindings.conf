# Window-management keybindings for the kiosk sway session.
#
# This drop-in is included from /etc/sway/config via its final
# `include /etc/sway/config.d/*` line, so the upstream variables
# $mod (= Mod4), $left/$down/$up/$right (= h/j/k/l) are already in
# scope. Sway resolves conflicting bindsym lines last-match-wins, so
# anything here supersedes the equivalent lines in the shipped config.

# Default new containers to a tabbed layout rather than sway's out-of-
# the-box horizontal split. On the single-touchscreen kiosk form factor,
# tabs (title row across the top) are easier to drive than side-by-side
# tiles.
workspace_layout tabbed

# Switch the current container's layout. Both bindings also exist in
# the upstream /etc/sway/config, repeated here so this file remains the
# authoritative reference for the kiosk's window-management bindings.
bindsym $mod+w layout tabbed
bindsym $mod+s layout stacking

# Close the focused window. Upstream binds kill to $mod+Shift+q only;
# the single-chord $mod+q is the primary close shortcut for the kiosk.
# The Shift variant stays bound via the base config as a muscle-memory
# fallback.
bindsym $mod+q kill

# Move keyboard focus within the current workspace via the arrow keys.
bindsym $mod+Left  focus left
bindsym $mod+Down  focus down
bindsym $mod+Up    focus up
bindsym $mod+Right focus right

# Move the focused window within the current workspace with Shift+arrow.
bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Down  move down
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Right move right

# Switch workspaces with $mod+<N>, move the focused window to a
# workspace with $mod+Shift+<N>. N=1..9 use the matching number key;
# workspace 10 is reachable via 0.
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10
