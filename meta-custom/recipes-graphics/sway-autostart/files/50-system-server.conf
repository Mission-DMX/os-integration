# PulseAudio runs in --system mode on this image (see pulseaudio.service),
# which places its native socket at /var/run/pulse/native rather than at
# $XDG_RUNTIME_DIR/pulse/native. libpulse's default search order checks
# the per-user XDG runtime path first, so without this drop-in a client
# started from sway (XDG_RUNTIME_DIR=/run/sway) looks at
# /run/sway/pulse/native, finds nothing, and reports "Connection refused".
#
# Setting default-server points every libpulse-based client — pactl, foot
# shells, waybar's pulseaudio module, mdmx apps, etc. — at the real socket.
# Setting autospawn=no is defensive: libpulse would otherwise try to spawn
# a per-user daemon on connection failure, which would collide with the
# running system daemon (and would be denied the audio devices anyway).
default-server = unix:/var/run/pulse/native
autospawn = no
