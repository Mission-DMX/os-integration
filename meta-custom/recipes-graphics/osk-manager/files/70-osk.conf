# On-screen-keyboard integration for the kiosk sway session.
#
# Loaded from /etc/sway/config via its final `include /etc/sway/config.d/*`
# line. Ordered 70-* so it comes after console-settings-daemon's input
# wiring (60-console-settings.conf) — if the daemon restarts sway after
# applying a touchscreen quirks file, we want osk-manager to come up on
# the restarted session already seeing the correct input device set.

# Autostart the OSK lifecycle manager. osk-manager owns the wvkbd
# process directly (spawns it with --hidden plus --auto when no
# hardware keyboard is attached), so sway does NOT exec wvkbd itself.
exec /usr/bin/osk-manager

# Manual toggle for operators who have a hardware keyboard attached
# (`--auto` is disabled in that mode, so taps on text fields won't open
# the OSK on their own). The binding translates to a signal via oskctl,
# which also works when wvkbd was previously killed by the kiosk —
# osk-manager will respawn it before signalling.
bindsym $mod+k exec /usr/bin/oskctl toggle
